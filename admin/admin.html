<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Admin | Benis Burguer</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --primary: #ff9800;
            --bg: #0a0a0a;
            --card: #161616;
            --border: rgba(255,255,255,0.05);
        }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); color: #fff; margin: 0; padding: 30px; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        h1 { color: var(--primary); margin: 0; font-size: 24px; }
        
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { 
            background: var(--card); padding: 25px; border-radius: 15px; border: 1px solid var(--border);
            text-align: left; transition: 0.3s;
        }
        .card i { color: var(--primary); font-size: 24px; margin-bottom: 10px; }
        .card h3 { margin: 0; font-size: 14px; opacity: 0.7; text-transform: uppercase; }
        .card p { margin: 5px 0 0; font-size: 28px; font-weight: 700; }

        .table-container { background: var(--card); border-radius: 15px; overflow: hidden; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: rgba(255,152,0,0.1); padding: 15px; font-size: 14px; color: var(--primary); }
        td { padding: 15px; border-bottom: 1px solid var(--border); font-size: 14px; }
        tr:hover { background: rgba(255,255,255,0.02); }

        .badge { padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge-novo { background: #ff980020; color: #ff9800; }
        .badge-entregue { background: #25d36620; color: #25d366; }

        button { 
            background: var(--primary); border: none; padding: 8px 15px; border-radius: 8px; 
            color: white; font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        button:hover { transform: scale(1.05); background: #f57c00; }
        
        .refresh-tag { font-size: 12px; opacity: 0.5; }
    </style>
</head>
<body>

    <header>
        <h1><i class="fas fa-chart-line"></i> Painel Elite Admin</h1>
        <span class="refresh-tag"><i class="fas fa-sync fa-spin"></i> Atualizando em tempo real</span>
    </header>

    <div class="dashboard">
        <div class="card">
            <i class="fas fa-shopping-bag"></i>
            <h3>Pedidos Hoje</h3>
            <p id="totalPedidos">0</p>
        </div>
        <div class="card">
            <i class="fas fa-hand-holding-usd"></i>
            <h3>Faturamento</h3>
            <p id="faturamento">R$ 0,00</p>
        </div>
        <div class="card">
            <i class="fas fa-users"></i>
            <h3>Clientes</h3>
            <p id="totalClientes">0</p>
        </div>
    </div>

    <h2>Pedidos Recentes</h2>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Cliente</th>
                    <th>Itens</th>
                    <th>Total</th>
                    <th>Status</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody id="pedidosLista">
                </tbody>
        </table>
    </div>

    <script src="admin.js"></script>
</body>
</html>
