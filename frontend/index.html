<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Benis Burguer | Elite Delivery</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    
    <link rel="stylesheet" href="style.css">
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#ff8c00">
</head>
<body>

    <div id="loader" class="loader-wrapper">
        <div class="loader-content">
            <img src="logo.png" alt="Carregando..." class="loader-logo">
            <div class="progress-bar"></div>
        </div>
    </div>

    <header class="glass-header">
        <div class="header-container">
            <div class="logo">
                <img src="logo.png" alt="Benis Burguer" class="glow-effect">
            </div>
            <div class="social-links">
                <a href="https://www.instagram.com/obenisburguer" target="_blank" class="glass-icon"><i class="fab fa-instagram"></i></a>
                <a href="https://wa.me/556993668336" target="_blank" class="glass-icon"><i class="fab fa-whatsapp"></i></a>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="hero-elite">
            <div class="hero-badge">A melhor de Porto Velho</div>
            <h1>Sabor que vicia, <span class="text-gradient">qualidade que conquista.</span></h1>
            
            <div class="status-pill">
                <span id="statusLabel" class="status-dot"></span>
                <span id="statusText">Verificando status...</span>
                <small id="statusTimer" class="timer-desc"></small>
            </div>
        </section>

        <div class="nav-container-glass">
            <nav class="categorias-elite" id="categoryNav">
                <button class="tab-btn active" data-cat="hamburguer">
                    <i class="fas fa-hamburger"></i> Burguers
                </button>
                <button class="tab-btn" data-cat="porcoes">
                    <i class="fas fa-cheese"></i> Porções
                </button>
                <button class="tab-btn" data-cat="adicionais">
                    <i class="fas fa-plus-circle"></i> Extras
                </button>
                <button class="tab-btn" data-cat="bebidas">
                    <i class="fas fa-wine-glass"></i> Bebidas
                </button>
            </nav>
        </div>

        <section id="menu" class="menu-grid"></section>

        <section class="location-section">
            <div class="section-title">
                <i class="fas fa-map-marker-alt"></i>
                <h2>Onde estamos</h2>
            </div>
            <div class="map-card">
                <div id="mapaEntrega"></div>
                <div class="map-info">
                    <p>R. Paulo Fortes, 6245 - Aponiã, Porto Velho - RO</p>
                    <a href="https://www.google.com/maps/dir//R.+Paulo+Fortes,+6245+-+Aponi%C3%A3,+Porto+Velho+-+RO" target="_blank" class="btn-link">
                        Como chegar <i class="fas fa-external-link-alt"></i>
                    </a>
                </div>
            </div>
        </section>
    </main>

    <div class="cart-fab" id="cartToggle" onclick="toggleCarrinho()">
        <div class="cart-fab-icon">
            <i class="fas fa-shopping-basket"></i>
            <span id="cartCount" class="count-badge">0</span>
        </div>
        <div id="cartFabTotal" class="cart-fab-label">R$ 0,00</div>
    </div>

    <aside class="cart-panel-elite" id="cartPanel">
        <div class="cart-inner">
            <div class="cart-header-elite">
                <h3>Seu Pedido</h3>
                <button onclick="toggleCarrinho()" class="close-btn" aria-label="Fechar carrinho">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div id="cartItems" class="cart-content-scroll">
                </div>

            <div class="cart-summary">
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotalValue">R$ 0,00</span>
                </div>
                
                <div class="summary-row promo">
                    <input type="text" id="cupom" placeholder="🏷️ Código do Cupom">
                    <button class="apply-btn">Aplicar</button>
                </div>

                <div class="summary-row total">
                    <span>Total</span>
                    <span id="totalValue">R$ 0,00</span>
                </div>

                <button class="checkout-btn" onclick="checkout()">
                    <i class="fab fa-whatsapp"></i> Finalizar no WhatsApp
                </button>
            </div>
        </div>
    </aside>

    <div id="cartOverlay" class="cart-overlay" onclick="toggleCarrinho()"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
    <script src="mapa.js"></script>
    
    <script>
        // Registro do Service Worker para PWA
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("service-worker.js")
                .then(reg => console.log("Elite PWA Ativo!", reg.scope))
                .catch(err => console.error("Erro PWA:", err));
            });
        }
    </script>
</body>
</html>
