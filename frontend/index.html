<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Benis Burguer | Elite Delivery Porto Velho</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="style.css">
    
    <meta name="theme-color" content="#0a0a0a">
</head>
<body>

    <div id="loader" class="loader-wrapper">
        <div class="loader-content">
            <img src="logo.png" alt="Benis Burguer" class="loader-logo">
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <p class="loader-text">Preparando a brasa...</p>
        </div>
    </div>

    <header class="glass-header">
        <div class="header-container">
            <div class="logo-area">
                <img src="logo.png" alt="Benis Burguer Logo" class="logo-img">
            </div>
            <div class="header-actions">
                <div class="social-links">
                    <a href="https://www.instagram.com/obenisburguer" target="_blank" class="social-btn btn-instagram"><i class="fab fa-instagram"></i></a>
                    <a href="https://wa.me/556993668336" target="_blank" class="social-btn btn-whatsapp"><i class="fab fa-whatsapp"></i></a>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="hero-elite">
            <div class="hero-content">
                <span class="hero-badge"><i class="fas fa-crown"></i> O Brabo de Porto Velho</span>
                <h1>Sabor que vicia, <br><span class="text-gradient">qualidade que conquista.</span></h1>
                <div class="status-pill">
                    <div class="status-indicator">
                        <span id="statusLabel" class="status-dot"></span>
                        <span id="statusText">Verificando...</span>
                    </div>
                </div>
            </div>
        </section>

        <div class="nav-container-glass">
            <nav class="categorias-elite">
                <button class="tab-btn active" data-cat="hamburguer"><i class="fas fa-hamburger"></i> <span>Burguers</span></button>
                <button class="tab-btn" data-cat="porcoes"><i class="fas fa-cheese"></i> <span>Porções</span></button>
                <button class="tab-btn" data-cat="adicionais"><i class="fas fa-plus-circle"></i> <span>Extras</span></button>
                <button class="tab-btn" data-cat="bebidas"><i class="fas fa-wine-glass"></i> <span>Bebidas</span></button>
            </nav>
        </div>

        <section id="menu" class="menu-grid"></section>

        <section class="location-section">
            <div class="section-header-elite">
                <span class="mini-badge">Localização</span>
                <h2>Onde Estamos</h2>
            </div>
            <div class="map-card-wrapper">
                <div id="mapaEntrega"></div>
                <div class="map-overlay-info">
                    <div class="address-details">
                        <i class="fas fa-map-marker-alt"></i>
                        <div class="text-info">
                            <strong>Benis Burguer</strong>
                            <p>R. Paulo Fortes, 6245 - Aponiã</p>
                        </div>
                    </div>
                    <a href="https://www.google.com/maps/dir/?api=1&destination=-8.7335,-63.8715" target="_blank" class="btn-route-premium">
                        <i class="fas fa-directions"></i> <span>Como chegar</span>
                    </a>
                </div>
            </div>
        </section>
    </main>

    <div class="cart-fab" id="cartToggle" onclick="toggleCarrinho()">
        <div class="cart-fab-icon">
            <i class="fas fa-shopping-bag"></i>
            <span id="cartCount" class="count-badge">0</span>
        </div>
        <div id="cartFabTotal" class="cart-fab-label">Ver sacola (R$ 0,00)</div>
    </div>

    <aside class="cart-panel-elite" id="cartPanel">
        <div class="cart-inner">
            <div class="cart-header-elite">
                <h3><i class="fas fa-shopping-cart"></i> Seu Pedido</h3>
                <button onclick="toggleCarrinho()" class="close-btn"><i class="fas fa-times"></i></button>
            </div>

            <div id="cartItems" class="cart-content-scroll"></div>

            <div class="cart-footer-elite">
                <div class="coupon-area">
                    <div class="input-group-modern">
                        <div class="input-wrapper">
                            <i class="fas fa-ticket-alt"></i>
                            <input type="text" id="cupom" placeholder="CUPOM DE DESCONTO">
                        </div>
                        <button id="btnAplicarCupom" onclick="aplicarCupom()">APLICAR</button>
                    </div>
                </div>
                <div class="total-summary">
                    <div class="total-row">
                        <span>Subtotal</span>
                        <span id="subtotalValue">R$ 0,00</span>
                    </div>
                    <div class="total-row main">
                        <span>Total Final</span>
                        <span id="totalValue">R$ 0,00</span>
                    </div>
                </div>
                <button class="checkout-btn" onclick="checkout()">
                    <span>FINALIZAR PEDIDO</span> <i class="fab fa-whatsapp"></i>
                </button>
            </div>
        </div>
    </aside>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
