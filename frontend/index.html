<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Benis Burguer | Elite Edition</title>
    
    <meta name="description" content="O melhor hambúrguer gourmet de Porto Velho/RO. Qualidade premium e sabor inconfundível no Aponiã.">
    <meta name="theme-color" content="#0a0a0a">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="loader" class="loader-wrapper">
        <img src="logo.png" class="loader-logo" alt="Carregando Benis Burguer" onerror="this.src='https://via.placeholder.com/120x120/ff8c00/ffffff?text=BENIS'">
        <div class="progress-container" style="width: 200px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; margin-top: 20px;">
            <div id="progressBar" style="width: 0%; height: 100%; background: #ff8c00; transition: width 0.4s ease;"></div>
        </div>
    </div>

    <header class="glass-header">
        <div class="header-container">
            <div class="logo-wrapper">
                <img src="logo.png" alt="Benis Burguer Logo" class="logo-img" onerror="this.src='https://via.placeholder.com/45x45/ff8c00/ffffff?text=B'">
            </div>
            <div class="social-links">
                <a href="https://www.instagram.com/" target="_blank" class="social-btn btn-instagram" aria-label="Instagram">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="https://wa.me/556993668336" target="_blank" class="social-btn btn-whatsapp" aria-label="WhatsApp">
                    <i class="fab fa-whatsapp"></i>
                </a>
            </div>
        </div>
    </header>

    <main>
        <section class="hero-elite">
            <span class="hero-badge"><i class="fas fa-crown"></i> O Brabo de Porto Velho</span>
            <h1>Sabor que vicia, <br><span class="text-gradient" style="background: var(--gradient-glow); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">qualidade que conquista.</span></h1>
            <div class="status-indicator">
                <span id="statusLabel" class="status-dot"></span>
                <span id="statusText">Verificando braseiro...</span>
            </div>
        </section>

        <div class="nav-container-glass">
            <nav class="categorias-elite">
                <button class="tab-btn active" data-cat="hamburguer" onclick="mostrarCategoria('hamburguer')">
                    <i class="fas fa-hamburger"></i>
                    <span>Burguers</span>
                </button>
                <button class="tab-btn" data-cat="porcoes" onclick="mostrarCategoria('porcoes')">
                    <i class="fas fa-drumstick-bite"></i>
                    <span>Porções</span>
                </button>
                <button class="tab-btn" data-cat="bebidas" onclick="mostrarCategoria('bebidas')">
                    <i class="fas fa-bottle-water"></i>
                    <span>Bebidas</span>
                </button>
                <button class="tab-btn" data-cat="extras" onclick="mostrarCategoria('extras')">
                    <i class="fas fa-plus-circle"></i>
                    <span>Extras</span>
                </button>
            </nav>
        </div>

        <section id="menu" class="menu-grid"></section>

        <section class="location-section">
            <div class="hero-badge" style="margin-bottom: 30px; display: table; margin-inline: auto;">
                <i class="fas fa-map-marker-alt"></i> Onde estamos
            </div>
            <div id="mapaEntrega" class="map-card-wrapper"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Benis Burguer - Porto Velho/RO</p>
        <p style="margin-top: 5px; font-size: 0.7rem; opacity: 0.5;">Gourmet Visual Engine v6.7 Elite Edition</p>
    </footer>

    <div id="cartToggle" class="cart-fab" onclick="toggleCarrinho()" style="display: none;">
        <div class="cart-fab-content" style="display: flex; align-items: center; gap: 12px;">
            <div style="position: relative;">
                <i class="fas fa-shopping-bag" style="font-size: 1.4rem;"></i>
                <span id="cartCount" style="position: absolute; top: -8px; right: -8px; background: #fff; color: #000; font-size: 0.7rem; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800;">0</span>
            </div>
            <span id="cartFabTotal">Ver sacola (R$ 0,00)</span>
        </div>
        <i class="fas fa-chevron-right"></i>
    </div>

    <aside id="cartPanel" class="cart-panel-elite">
        <div class="cart-header-elite">
            <h2><i class="fas fa-shopping-basket"></i> Sacola</h2>
            <button class="btn-close-cart" onclick="toggleCarrinho()" aria-label="Fechar sacola">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div id="cartItems" class="cart-content-scroll">
            </div>

        <div class="cart-footer-elite">
            <div class="coupon-wrapper">
                <input type="text" id="cupom" placeholder="CUPOM DE DESCONTO">
                <button class="btn-apply-coupon" onclick="aplicarCupom()">
                    <i class="fas fa-arrow-right"></i>
                </button>
            </div>

            <div class="total-details">
                <div class="detail-row">
                    <span>Subtotal</span>
                    <span id="subtotalValue">R$ 0,00</span>
                </div>
                <div id="discountRow" class="detail-row" style="display: none; color: #25d366;">
                    <span>Desconto</span>
                    <span id="discountValue">- R$ 0,00</span>
                </div>
                <div class="detail-row grand-total">
                    <span>Total</span>
                    <span id="totalValue">R$ 0,00</span>
                </div>
            </div>

            <button class="checkout-btn" onclick="checkout()">
                <span>PEDIR PELO WHATSAPP</span>
                <i class="fab fa-whatsapp"></i>
            </button>
        </div>
    </aside>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="app.js"></script>
</body>
</html>
