<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Benis Burguer | Elite Delivery Porto Velho</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    
    <link rel="stylesheet" href="style.css">
    
    <meta name="theme-color" content="#0a0a0a">
</head>
<body>

    <div id="loader" class="loader-wrapper">
        <div class="loader-content">
            <img src="logo.png" alt="Benis Burguer" class="loader-logo">
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <p class="loader-text">Preparando a brasa...</p>
        </div>
    </div>

    <header class="glass-header">
        <div class="header-container">
            <div class="logo-area">
                <img src="logo.png" alt="Benis Burguer Logo" class="logo-img">
            </div>
            <div class="social-links">
                <a href="#" class="social-btn btn-instagram"><i class="fab fa-instagram"></i></a>
                <a href="#" class="social-btn btn-whatsapp"><i class="fab fa-whatsapp"></i></a>
            </div>
        </div>
    </header>

    <main>
        <section class="hero-elite">
            <span class="hero-badge">O Brabo de Porto Velho</span>
            <h1>Sabor que vicia, <br><span class="text-gradient">qualidade que conquista.</span></h1>
            
            <div class="status-pill">
                <span class="status-dot online"></span>
                <span id="statusText">Estamos abertos!</span>
            </div>
        </section>

        <div class="nav-container-glass">
            <nav class="categorias-elite">
                <button class="tab-btn active" data-cat="burguers"><i class="fas fa-hamburger"></i> Burguers</button>
                <button class="tab-btn" data-cat="porcoes"><i class="fas fa-cheese"></i> Porções</button>
                <button class="tab-btn" data-cat="bebidas"><i class="fas fa-wine-glass"></i> Bebidas</button>
            </nav>
        </div>

        <section id="menu" class="menu-grid">
            </section>

        <section class="location-section">
            <div class="map-card-wrapper">
                <div id="mapaEntrega"></div>
                <div class="map-overlay-info">
                    <div class="address-text">
                        <p><i class="fas fa-map-marker-alt"></i> R. Paulo Fortes, 6245 - Aponiã</p>
                    </div>
                    <a href="https://www.google.com/maps/dir//-8.74015,-63.87498" target="_blank" class="route-link">Como chegar</a>
                </div>
            </div>
        </section>
    </main>

    <div class="cart-fab" id="cartToggle" onclick="toggleCarrinho()">
        <div class="cart-fab-content">
            <div class="cart-fab-icon">
                <i class="fas fa-shopping-bag"></i>
                <span id="cartCount" class="count-badge">0</span>
            </div>
            <span id="cartFabTotal">Ver sacola (R$ 0,00)</span>
        </div>
    </div>

    <aside class="cart-panel-elite" id="cartPanel">
        <div class="cart-inner">
            <div class="cart-header-elite">
                <h3><i class="fas fa-shopping-cart"></i> Seu Pedido</h3>
                <button onclick="toggleCarrinho()" class="close-btn"><i class="fas fa-times"></i></button>
            </div>

            <div id="cartItems" class="cart-content-scroll">
                <div class="cart-item-elite">
                    <div class="item-info">
                        <h4>X-Bauru</h4>
                        <span class="item-price">R$ 8,00</span>
                    </div>
                    <button class="remove-btn"><i class="fas fa-trash-alt"></i></button>
                </div>
            </div>

            <div class="cart-footer-elite">
                <div class="coupon-area">
                    <div class="input-group-glass">
                        <input type="text" id="cupom" placeholder="CUPOM">
                        <button onclick="aplicarCupom()">Aplicar</button>
                    </div>
                </div>
                
                <div class="total-row">
                    <span>Total</span>
                    <span id="totalValue">R$ 8,00</span>
                </div>

                <button class="checkout-btn" onclick="checkout()">
                    <span>Finalizar Pedido</span> <i class="fab fa-whatsapp"></i>
                </button>
            </div>
        </div>
    </aside>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script> <script src="mapa.js"></script> <script>
        // Loader Handler
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loader').classList.add('fade-out');
                if(typeof iniciarMapa === 'function') iniciarMapa();
            }, 1000);
        });
    </script>
</body>
</html>
