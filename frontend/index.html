<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Benis Burguer | Porto Velho</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="loader" class="loader-wrapper">
        <img src="logo.png" class="loader-logo" onerror="this.src='https://via.placeholder.com/120?text=BENIS'">
        <div class="progress-container"><div id="progressBar" class="progress-bar"></div></div>
    </div>

    <header class="glass-header">
        <div class="header-container">
            <img src="logo.png" alt="Logo" class="logo-img" onerror="this.src='https://via.placeholder.com/45?text=BENIS'">
            <div class="social-links">
                <a href="#" class="social-btn btn-instagram"><i class="fab fa-instagram"></i></a>
                <a href="https://wa.me/556993668336" class="social-btn btn-whatsapp"><i class="fab fa-whatsapp"></i></a>
            </div>
        </div>
    </header>

    <main>
        <section class="hero-elite">
            <span class="hero-badge"><i class="fas fa-crown"></i> O Brabo de Porto Velho</span>
            <h1>Sabor que vicia, <br><span class="text-gradient">qualidade que conquista.</span></h1>
            <div class="status-indicator">
                <span id="statusLabel" class="status-dot"></span>
                <span id="statusText">Carregando...</span>
            </div>
        </section>

        <div class="nav-container-glass">
            <nav class="categorias-elite">
                <button class="tab-btn active" data-cat="hamburguer" onclick="mostrarCategoria('hamburguer')">
                    <i class="fas fa-hamburger"></i><span>Burguers</span>
                </button>
                <button class="tab-btn" data-cat="porcoes" onclick="mostrarCategoria('porcoes')">
                    <i class="fas fa-fries"></i><span>Porções</span>
                </button>
                <button class="tab-btn" data-cat="bebidas" onclick="mostrarCategoria('bebidas')">
                    <i class="fas fa-glass-water"></i><span>Bebidas</span>
                </button>
            </nav>
        </div>

        <section id="menu" class="menu-grid"></section>

        <section class="location-section">
            <div id="mapaEntrega" class="map-card-wrapper"></div>
        </section>
    </main>

    <div id="cartToggle" class="cart-fab" onclick="toggleCarrinho()">
        <div style="display: flex; align-items: center; gap: 12px;">
            <div style="position: relative;">
                <i class="fas fa-shopping-bag"></i>
                <span id="cartCount">0</span>
            </div>
            <span id="cartFabTotal">Ver sacola (R$ 0,00)</span>
        </div>
        <i class="fas fa-chevron-right"></i>
    </div>

    <aside id="cartPanel" class="cart-panel-elite">
        <div class="cart-header-elite">
            <h3><i class="fas fa-shopping-cart" style="color: var(--primary);"></i> Sua Sacola</h3>
            <button class="btn-close-cart" onclick="toggleCarrinho()"><i class="fas fa-times"></i></button>
        </div>

        <div id="cartItems" class="cart-content-scroll"></div>

        <div class="cart-footer-elite">
            <div class="coupon-section" id="couponContainer">
                <div class="input-group-modern">
                    <i class="fas fa-ticket-alt"></i>
                    <input type="text" id="cupom" placeholder="CÓDIGO DO CUPOM">
                    <button id="btnAplicarCupom" onclick="aplicarCupom()">APLICAR</button>
                </div>
            </div>

            <div class="total-summary">
                <div class="summary-row"><span>Subtotal</span><span id="subtotalValue">R$ 0,00</span></div>
                <div class="summary-row discount" id="discountRow" style="display: none;">
                    <span>Desconto</span><span id="discountValue">- R$ 0,00</span>
                </div>
                <div class="total-row main"><span>Total</span><span id="totalValue">R$ 0,00</span></div>
            </div>

            <button class="checkout-btn" onclick="checkout()">
                FINALIZAR PEDIDO <i class="fab fa-whatsapp"></i>
            </button>
        </div>
    </aside>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
