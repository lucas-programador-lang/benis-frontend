<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Benis Burguer | Elite Delivery</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="style.css">
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#121212">
    <meta name="description" content="O melhor hambúrguer artesanal de Porto Velho. Peça agora pelo nosso delivery elite.">
</head>
<body>

    <div id="loader" class="loader-wrapper">
        <div class="loader-content">
            <div class="loader-logo-container">
                <img src="logo.png" alt="Benis Burguer" class="loader-logo">
            </div>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <p class="loader-text">Preparando a brasa...</p>
        </div>
    </div>

    <header class="glass-header">
        <div class="header-container">
            <div class="logo-area">
                <img src="logo.png" alt="Benis Burguer Logo" class="logo-img">
            </div>
            <div class="header-actions">
                <div class="social-links">
                    <a href="https://www.instagram.com/obenisburguer" target="_blank" class="glass-icon" aria-label="Instagram">
                        <i class="fab fa-instagram"></i>
                    </a>
                    <a href="https://wa.me/556993668336" target="_blank" class="glass-icon" aria-label="WhatsApp">
                        <i class="fab fa-whatsapp"></i>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="hero-elite">
            <div class="hero-content">
                <span class="hero-badge"><i class="fas fa-crown"></i> A melhor de Porto Velho</span>
                <h1>Sabor que vicia, <br><span class="text-gradient">qualidade que conquista.</span></h1>
                
                <div class="status-pill" id="statusContainer">
                    <div class="status-indicator">
                        <span id="statusLabel" class="status-dot"></span>
                        <span id="statusText">Verificando restaurante...</span>
                    </div>
                    <small id="statusTimer" class="timer-desc"></small>
                </div>
            </div>
        </section>

        <div class="nav-container-glass">
            <nav class="categorias-elite" id="categoryNav">
                <button class="tab-btn active" data-cat="hamburguer">
                    <i class="fas fa-hamburger"></i>
                    <span>Burguers</span>
                </button>
                <button class="tab-btn" data-cat="porcoes">
                    <i class="fas fa-cheese"></i>
                    <span>Porções</span>
                </button>
                <button class="tab-btn" data-cat="adicionais">
                    <i class="fas fa-plus-circle"></i>
                    <span>Extras</span>
                </button>
                <button class="tab-btn" data-cat="bebidas">
                    <i class="fas fa-wine-glass"></i>
                    <span>Bebidas</span>
                </button>
            </nav>
        </div>

        <section id="menu" class="menu-grid">
            </section>

        <section class="location-section">
            <div class="section-header">
                <span class="section-subtitle">Visite-nos</span>
                <h2 class="section-title"><i class="fas fa-map-marked-alt"></i> Onde estamos</h2>
            </div>
            
            <div class="map-card-wrapper">
                <div id="mapaEntrega"></div>
                <div class="map-overlay-info">
                    <div class="info-content">
                        <i class="fas fa-location-arrow" style="color: var(--primary); margin-right: 10px;"></i>
                        <p>R. Paulo Fortes, 6245 - Aponiã, Porto Velho</p>
                    </div>
                    <a href="https://www.google.com/maps/search/?api=1&query=Benis+Burguer+Porto+Velho" target="_blank" class="btn-location">
                        Como chegar <i class="fas fa-external-link-alt"></i>
                    </a>
                </div>
            </div>
        </section>
    </main>

    <div class="cart-fab" id="cartToggle" onclick="toggleCarrinho()" role="button" aria-label="Abrir Carrinho">
        <div class="cart-fab-content">
            <div class="cart-fab-icon">
                <i class="fas fa-shopping-bag"></i>
                <span id="cartCount" class="count-badge">0</span>
            </div>
            <div id="cartFabTotal" class="cart-fab-label">R$ 0,00</div>
        </div>
    </div>

    <aside class="cart-panel-elite" id="cartPanel">
        <div class="cart-inner">
            <div class="cart-header-elite">
                <h3><i class="fas fa-shopping-cart"></i> Seu Pedido</h3>
                <button onclick="toggleCarrinho()" class="close-btn" aria-label="Fechar carrinho">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div id="cartItems" class="cart-content-scroll">
                <div class="empty-cart-msg">
                    <i class="fas fa-box-open"></i>
                    <p>Seu carrinho está vazio</p>
                </div>
            </div>

            <div class="cart-footer-elite">
                <div class="summary-details">
                    <div class="total-row">
                        <span>Total</span>
                        <span id="totalValue">R$ 0,00</span>
                    </div>
                    
                    <div class="coupon-area">
                        <div class="input-group-glass">
                            <i class="fas fa-tag"></i>
                            <input type="text" id="cupom" placeholder="CUPOM">
                            <button id="btnAplicarCupom" onclick="aplicarCupom()">Aplicar</button>
                        </div>
                    </div>
                </div>

                <button class="checkout-btn" onclick="checkout()">
                    <span>Finalizar no WhatsApp</span>
                    <i class="fab fa-whatsapp"></i>
                </button>
            </div>
        </div>
    </aside>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
    <script src="mapa.js"></script>
    
    <script>
        // Simulação do Loader Premium
        window.addEventListener('DOMContentLoaded', () => {
            const bar = document.getElementById('progressBar');
            let width = 0;
            const interval = setInterval(() => {
                if (width >= 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        document.getElementById('loader').classList.add('fade-out');
                    }, 400);
                } else {
                    width += Math.random() * 15;
                    if(width > 100) width = 100;
                    bar.style.width = width + '%';
                }
            }, 60);
        });
    </script>
</body>
</html>
